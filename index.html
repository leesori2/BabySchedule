<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>아기 수유 스케줄러</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #F4F6FA;
      color: #191F28;
      display: flex;
      justify-content: center;
      padding: 16px 12px 40px;
    }
    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #191F28;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .time-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .time-box {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .time-box label {
      font-size: 13px;
      font-weight: 600;
      color: #64748B;
    }
    .select-group {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    select {
      flex: 1;
      height: 38px;
      border: 1px solid #CBD5E1;
      border-radius: 10px;
      background: #FFFFFF;
      font-size: 16px;
      font-weight: 600;
      color: #0F172A;
      text-align: center;
      outline: none;
    }
    select:focus {
      border-color: #2B78E4;
    }
    .seg-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #E2E8F0;
      padding: 4px;
      border-radius: 14px;
      gap: 4px;
    }
    .seg-btn {
      border: none;
      background: transparent;
      padding: 10px;
      font-size: 14px;
      font-weight: 700;
      color: #64748B;
      border-radius: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .seg-btn.active {
      background: #FFFFFF;
      color: #2B78E4;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 8px;
    }
    .progress-val {
      font-size: 20px;
      font-weight: 800;
      color: #2B78E4;
    }
    .progress-target {
      font-size: 13px;
      color: #8B95A1;
      font-weight: 500;
    }
    .progress-bar-bg {
      height: 10px;
      background: #EEF2F6;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-bar-fill {
      height: 100%;
      background: #2B78E4;
      width: 0%;
      border-radius: 99px;
      transition: width 0.3s ease;
    }
    .steps-row {
      display: flex;
      justify-content: space-between;
      position: relative;
      margin-top: 6px;
    }
    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      flex: 1;
    }
    .step-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #F1F4F9;
      color: #8B95A1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      transition: all 0.2s;
    }
    .step-item.done .step-circle {
      background: #2B78E4;
      color: #FFFFFF;
    }
    .step-label {
      font-size: 11px;
      color: #8B95A1;
      font-weight: 600;
    }
    .step-item.done .step-label {
      color: #2B78E4;
    }
    .btn-reset {
      font-size: 12px;
      color: #8B95A1;
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
    }
    .timeline-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .feed-card {
      background: #FFFFFF;
      border: 1.5px solid #F1F4F9;
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }
    .feed-card.done {
      background: #F8FAFD;
      border-color: #D3E2F8;
    }
    .feed-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .feed-badge {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: #EEF4FD;
      color: #2B78E4;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .feed-card.done .feed-badge {
      background: #2B78E4;
      color: #FFFFFF;
    }
    .feed-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .feed-time {
      font-size: 16px;
      font-weight: 700;
      color: #191F28;
    }
    .feed-desc {
      font-size: 12px;
      color: #8B95A1;
    }
    .feed-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .feed-amount {
      text-align: right;
    }
    .feed-ml {
      font-size: 15px;
      font-weight: 800;
      color: #191F28;
    }
    .feed-spoons {
      font-size: 11px;
      color: #2B78E4;
      font-weight: 600;
    }
    .check-btn {
      border: 1.5px solid #E2E8F0;
      background: #FFFFFF;
      color: #94A3B8;
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .feed-card.done .check-btn {
      border-color: #2B78E4;
      background: #2B78E4;
      color: #FFFFFF;
    }
    .btn-copy {
      width: 100%;
      height: 48px;
      background: #2B78E4;
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 6px;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(25, 31, 40, 0.9);
      color: #FFFFFF;
      padding: 10px 18px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      z-index: 100;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- 1. 시간 설정 박스 (최상단) -->
  <div class="card">
    <div class="card-title">수유 기준 시간 설정</div>
    <div class="time-grid">
      <div class="time-box">
        <label>첫수 (아침)</label>
        <div class="select-group">
          <select id="firstH">
            <option value="5">05시</option><option value="6">06시</option><option value="7">07시</option>
            <option value="8" selected>08시</option><option value="9">09시</option><option value="10">10시</option>
            <option value="11">11시</option><option value="12">12시</option>
          </select>
          <select id="firstM">
            <option value="0">00분</option><option value="10">10분</option><option value="20">20분</option>
            <option value="30" selected>30분</option><option value="40">40분</option><option value="50">50분</option>
          </select>
        </div>
      </div>
      <div class="time-box">
        <label>막수 (밤잠 전)</label>
        <div class="select-group">
          <select id="lastH">
            <option value="18">18시</option><option value="19">19시</option><option value="20">20시</option>
            <option value="21" selected>21시</option><option value="22">22시</option><option value="23">23시</option>
          </select>
          <select id="lastM">
            <option value="0">00분</option><option value="10">10분</option><option value="20">20분</option>
            <option value="30" selected>30분</option><option value="40">40분</option><option value="50">50분</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. 5회 / 4회 모드 선택 -->
  <div class="seg-container">
    <button class="seg-btn active" id="mode5Btn" onclick="setMode(5)">5회 스케줄 (추천)</button>
    <button class="seg-btn" id="mode4Btn" onclick="setMode(4)">4회 스케줄</button>
  </div>

  <!-- 3. 진행도 현황 카드 -->
  <div class="card">
    <div class="progress-header">
      <div>
        <div style="font-size: 13px; font-weight: 600; color: #64748B; margin-bottom: 2px;">오늘 수유 진행도</div>
        <div class="progress-val" id="progressVal">0 ml</div>
      </div>
      <div style="text-align: right;">
        <button class="btn-reset" onclick="resetTodayDone()">오늘 기록 초기화</button>
        <div class="progress-target" id="progressTarget">목표 800ml</div>
      </div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="steps-row" id="stepsRow"></div>
  </div>

  <!-- 4. 타임라인 목록 -->
  <div class="timeline-list" id="timelineList"></div>

  <!-- 5. 텍스트 복사 버튼 -->
  <button class="btn-copy" onclick="copySchedule()">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <rect x="9" y="9" width="13" height="13" rx="2"></rect>
      <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path>
    </svg>
    스케줄 텍스트 복사하기
  </button>

</div>

<div class="toast" id="toast">클립보드에 복사되었습니다!</div>

<script>
  let currentMode = 5;
  let doneList = [];
  let currentSchedule = [];

  const STORAGE_KEY_CONFIG = 'baby_feeding_config';
  const STORAGE_KEY_DONE = 'baby_feeding_done_today';

  function getTodayString() {
    const d = new Date();
    return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
  }

  function loadSavedData() {
    try {
      const savedConfig = localStorage.getItem(STORAGE_KEY_CONFIG);
      if (savedConfig) {
        const cfg = JSON.parse(savedConfig);
        if (cfg.firstH !== undefined) document.getElementById('firstH').value = cfg.firstH;
        if (cfg.firstM !== undefined) document.getElementById('firstM').value = cfg.firstM;
        if (cfg.lastH !== undefined) document.getElementById('lastH').value = cfg.lastH;
        if (cfg.lastM !== undefined) document.getElementById('lastM').value = cfg.lastM;
        if (cfg.mode !== undefined) currentMode = cfg.mode;
      }

      const savedDone = localStorage.getItem(STORAGE_KEY_DONE);
      if (savedDone) {
        const record = JSON.parse(savedDone);
        if (record.date === getTodayString() && Array.isArray(record.doneList)) {
          doneList = record.doneList;
        } else {
          doneList = [];
        }
      }
    } catch(e) {}
  }

  function saveConfig() {
    try {
      const cfg = {
        firstH: document.getElementById('firstH').value,
        firstM: document.getElementById('firstM').value,
        lastH: document.getElementById('lastH').value,
        lastM: document.getElementById('lastM').value,
        mode: currentMode
      };
      localStorage.setItem(STORAGE_KEY_CONFIG, JSON.stringify(cfg));
    } catch(e) {}
  }

  function saveDone() {
    try {
      const record = {
        date: getTodayString(),
        doneList: doneList
      };
      localStorage.setItem(STORAGE_KEY_DONE, JSON.stringify(record));
    } catch(e) {}
  }

  function resetTodayDone() {
    doneList = [];
    saveDone();
    render();
    showToast('오늘 수유 기록이 초기화되었습니다.');
  }

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('mode5Btn').classList.toggle('active', mode === 5);
    document.getElementById('mode4Btn').classList.toggle('active', mode === 4);
    saveConfig();
    render();
  }

  function toggleDone(idx) {
    if (doneList.includes(idx)) {
      doneList = doneList.filter(i => i !== idx);
    } else {
      doneList.push(idx);
    }
    saveDone();
    render();
  }

  function formatTime(m) {
    const totalMinutes = ((m % 1440) + 1440) % 1440;
    const h = Math.floor(totalMinutes / 60);
    const min = totalMinutes % 60;
    return `${String(h).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
  }

  function calculateSchedule() {
    const firstH = parseInt(document.getElementById('firstH').value);
    const firstM = parseInt(document.getElementById('firstM').value);
    const lastH = parseInt(document.getElementById('lastH').value);
    const lastM = parseInt(document.getElementById('lastM').value);

    let start = firstH * 60 + firstM;
    let end = lastH * 60 + lastM;
    if (end <= start) end += 1440;

    const span = end - start;
    const schedule = [];

    if (currentMode === 5) {
      const interval = Math.round(span / 4);
      schedule.push({ time: formatTime(start), amount: 200, spoons: 5, label: "첫수", note: "아침 첫 수유" });
      schedule.push({ time: formatTime(start + interval), amount: 120, spoons: 3, label: "2회", note: "오전 보충" });
      schedule.push({ time: formatTime(start + interval * 2), amount: 160, spoons: 4, label: "3회", note: "낮 메인 수유" });
      schedule.push({ time: formatTime(start + interval * 3), amount: 120, spoons: 3, label: "4회", note: "저녁 가벼운 수유" });
      schedule.push({ time: formatTime(end), amount: 200, spoons: 5, label: "막수", note: "밤잠 통잠용" });
    } else {
      const interval = Math.round(span / 3);
      schedule.push({ time: formatTime(start), amount: 200, spoons: 5, label: "첫수", note: "아침 첫 수유" });
      schedule.push({ time: formatTime(start + interval), amount: 200, spoons: 5, label: "2회", note: "점심 수유" });
      schedule.push({ time: formatTime(start + interval * 2), amount: 200, spoons: 5, label: "3회", note: "오후 수유" });
      schedule.push({ time: formatTime(end), amount: 200, spoons: 5, label: "막수", note: "밤잠 통잠용" });
    }
    return schedule;
  }

  function render() {
    currentSchedule = calculateSchedule();
    const timeline = document.getElementById('timelineList');
    const stepsRow = document.getElementById('stepsRow');
    
    let totalTarget = 0;
    let currentTotal = 0;

    timeline.innerHTML = '';
    stepsRow.innerHTML = '';

    currentSchedule.forEach((item, idx) => {
      totalTarget += item.amount;
      const isDone = doneList.includes(idx);
      if (isDone) currentTotal += item.amount;

      // 타임라인 카드
      const card = document.createElement('div');
      card.className = `feed-card ${isDone ? 'done' : ''}`;
      card.innerHTML = `
        <div class="feed-left">
          <div class="feed-badge">${item.label}</div>
          <div class="feed-info">
            <div class="feed-time">${item.time}</div>
            <div class="feed-desc">${item.note}</div>
          </div>
        </div>
        <div class="feed-right">
          <div class="feed-amount">
            <div class="feed-ml">${item.amount}ml</div>
            <div class="feed-spoons">${item.spoons}스푼</div>
          </div>
          <button class="check-btn" onclick="toggleDone(${idx})">
            ${isDone ? '완료됨' : '수유 완료'}
          </button>
        </div>
      `;
      timeline.appendChild(card);

      // 상단 스텝 동그라미
      const stepItem = document.createElement('div');
      stepItem.className = `step-item ${isDone ? 'done' : ''}`;
      stepItem.onclick = () => toggleDone(idx);
      stepItem.innerHTML = `
        <div class="step-circle">${isDone ? '✓' : (idx + 1)}</div>
        <div class="step-label">${item.label}</div>
      `;
      stepsRow.appendChild(stepItem);
    });

    // 진행도 바 갱신
    document.getElementById('progressVal').innerText = `${currentTotal} ml`;
    document.getElementById('progressTarget').innerText = `목표 ${totalTarget}ml`;
    const pct = Math.min(100, Math.round((currentTotal / totalTarget) * 100));
    document.getElementById('progressBar').style.width = `${pct}%`;
  }

  function copySchedule() {
    let text = `🍼 아기 수유 스케줄 (${currentMode}회 플랜)\n`;
    currentSchedule.forEach(item => {
      text += `• ${item.label} (${item.time}): ${item.amount}ml (${item.spoons}스푼)\n`;
    });
    
    const ta = document.createElement('textarea');
    ta.value = text.trim();
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast('스케줄이 복사되었습니다!');
    } catch(e) {}
    document.body.removeChild(ta);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  window.addEventListener('DOMContentLoaded', () => {
    loadSavedData();
    ['firstH', 'firstM', 'lastH', 'lastM'].forEach(id => {
      document.getElementById(id).addEventListener('change', () => {
        saveConfig();
        render();
      });
    });
    setMode(currentMode);
  });
</script>

</body>
</html>
