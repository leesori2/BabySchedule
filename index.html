<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>아기 수유 스케줄러</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #F4F6FA;
      color: #191F28;
      display: flex;
      justify-content: center;
      padding: 16px 12px 40px;
    }
    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #191F28;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .time-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .time-box {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .time-box label {
      font-size: 13px;
      font-weight: 600;
      color: #64748B;
    }
    .select-group {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    select {
      flex: 1;
      height: 38px;
      border: 1px solid #CBD5E1;
      border-radius: 10px;
      background: #FFFFFF;
      font-size: 16px;
      font-weight: 600;
      color: #0F172A;
      text-align: center;
      outline: none;
    }
    select:focus {
      border-color: #2B78E4;
    }
    .seg-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #E2E8F0;
      padding: 4px;
      border-radius: 14px;
      gap: 4px;
    }
    .seg-btn {
      border: none;
      background: transparent;
      padding: 10px;
      font-size: 14px;
      font-weight: 700;
      color: #64748B;
      border-radius: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .seg-btn.active {
      background: #FFFFFF;
      color: #2B78E4;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 8px;
    }
    .progress-val {
      font-size: 20px;
      font-weight: 800;
      color: #2B78E4;
    }
    .progress-target {
      font-size: 13px;
      color: #8B95A1;
      font-weight: 500;
    }
    .progress-bar-bg {
      height: 10px;
      background: #EEF2F6;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-bar-fill {
      height: 100%;
      background: #2B78E4;
      width: 0%;
      border-radius: 99px;
      transition: width 0.3s ease;
    }
    .steps-row {
      display: flex;
      justify-content: space-between;
      position: relative;
      margin-top: 6px;
    }
    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      flex: 1;
    }
    .step-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #F1F4F9;
      color: #8B95A1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      transition: all 0.2s;
    }
    .step-item.done .step-circle {
      background: #2B78E4;
      color: #FFFFFF;
    }
    .step-label {
      font-size: 11px;
      color: #8B95A1;
      font-weight: 600;
    }
    .step-item.done .step-label {
      color: #2B78E4;
    }
    .btn-reset {
      font-size: 12px;
      color: #8B95A1;
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
    }
    .timeline-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .feed-card {
      background: #FFFFFF;
      border: 1.5px solid #F1F4F9;
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }
    .feed-card.done {
      background: #F8FAFD;
      border-color: #D3E2F8;
    }
    .feed-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .feed-badge {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: #EEF4FD;
      color: #2B78E4;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .feed-card.done .feed-badge {
      background: #2B78E4;
      color: #FFFFFF;
    }
    .feed-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .feed-time {
      font-size: 16px;
      font-weight: 700;
      color: #191F28;
    }
    .feed-desc {
      font-size: 12px;
      color: #8B95A1;
    }
    .feed-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .feed-amount {
      text-align: right;
    }
    .feed-ml {
      font-size: 15px;
      font-weight: 800;
      color: #191F28;
    }
    .feed-spoons {
      font-size: 11px;
      color: #2B78E4;
      font-weight: 600;
    }
    .check-btn {
      border: 1.5px solid #E2E8F0;
      background: #FFFFFF;
      color: #94A3B8;
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .feed-card.done .check-btn {
      border-color: #2B78E4;
      background: #2B78E4;
      color: #FFFFFF;
    }
    .btn-copy {
      width: 100%;
      height: 48px;
      background: #2B78E4;
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 6px;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(25, 31, 40, 0.9);
      color: #FFFFFF;
      padding: 10px 18px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      z-index: 100;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="app-container">

  <div class="card">
    <div class="card-title">수유 기준 시간 설정</div>
    <div class="time-grid">
      <div class="time-box">
        <label>첫수 (아침)</label>
